<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정진">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>정진 · 몸, 정신, 돈, 가족</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#000;--sf:#0D0D0D;--sf2:#171717;--ln:#202020;--tx:#F5F5F3;--mu:#808080;--ft:#3D3D3D;--ac:#E5392B;--dn:#E5392B}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#FAFAF8;--sf:#FFFFFF;--sf2:#EEEEEA;--ln:#E3E3DF;--tx:#0A0A0A;--mu:#707070;--ft:#C6C6C2;--ac:#D42E20;--dn:#D42E20}}
html{background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--tx);background:var(--bg);font-size:16px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 24px calc(100px + env(safe-area-inset-bottom))}
@media(min-width:520px){body{background:var(--sf2)}#app{background:var(--bg);box-shadow:0 0 0 1px var(--ln)}}

/* 라벨: 작고, 넓게 */
.lbl,h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);font-weight:500;font-variant-numeric:tabular-nums}
.lbl b{color:var(--tx);font-weight:700}
h2{margin:48px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(26px + env(safe-area-inset-top))}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-right:9px;vertical-align:1px}
.hint{font-size:13px;color:var(--mu);line-height:1.6}
.hint b{color:var(--tx);font-weight:600}

/* 문장: 한 단어만 굵게 */
.say{font-size:30px;line-height:1.32;font-weight:500;color:var(--mu);letter-spacing:-.035em;margin:64px 0 56px;word-break:keep-all}
.say b{color:var(--tx);font-weight:800}
h1{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.25;margin:64px 0 40px}

.segs{display:flex;gap:6px}
.segs i{flex:1;height:2px;background:var(--ln);transition:background .3s}
.segs i.on{background:var(--tx)}
.mrow{display:flex;justify-content:space-between;margin-top:12px}

.rules{list-style:none;margin-top:28px;border-top:1px solid var(--ln)}
.rule{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--ln);min-height:76px}
.rule .no{flex:none;width:34px;font-size:11px;letter-spacing:.1em;color:var(--mu);font-variant-numeric:tabular-nums}
.rule .bd{flex:1;min-width:0}
.rule .tt{display:block;font-size:17px;font-weight:600;transition:color .2s}
.rule .sb{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ft);display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk svg{width:15px;height:15px;stroke:var(--bg);stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s}
.rule[aria-pressed=true] .chk{background:var(--tx);border-color:var(--tx)}
.rule[aria-pressed=true] .chk svg{opacity:1;transform:none}
.rule[aria-pressed=true] .tt{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--ft);text-decoration-thickness:1px}
.rule.pop .chk{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.22)}}

.blk{margin-top:36px}
.blk .ct{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.blk .hint{margin-top:6px}
.blk .row2,.blk>.btn{margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:12px;background:var(--tx);color:var(--bg);font-weight:700;font-size:15px;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--ft)}
.btn.danger{background:var(--dn);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.row2{display:flex;gap:10px}

.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);display:flex;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.14em;font-weight:500;color:var(--mu);transition:color .2s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--tx);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:10;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);max-height:94dvh;overflow:auto;background:var(--sf);border-top:1px solid var(--ln);border-radius:20px 20px 0 0;padding:10px 24px calc(24px + env(safe-area-inset-bottom));z-index:11;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:32px;height:3px;border-radius:2px;background:var(--ft);margin:0 auto 22px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet .hint{margin-top:4px}
.sheet .btn,.sheet .row2{margin-top:24px}
.sheet .row2 .btn{margin-top:0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}}
label.lb{display:block;font-size:11px;letter-spacing:.18em;color:var(--mu);font-weight:500;margin:22px 0 10px}
.in{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ft);border-radius:0;padding:10px 0 12px;font-size:17px;outline:0;resize:none}
.in:focus{border-color:var(--tx)}
.in::placeholder{color:var(--ft)}
.in:disabled{color:var(--mu)}
.chips{display:grid;gap:8px}
.chips.g5{grid-template-columns:repeat(5,1fr)}
.chips.g3{grid-template-columns:repeat(3,1fr)}
.chip{height:44px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--ln);font-size:15px;color:var(--mu);transition:all .15s;font-variant-numeric:tabular-nums}
.chip.on{background:var(--tx);color:var(--bg);box-shadow:none;font-weight:700}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:var(--bg);font-size:13px;font-weight:700;padding:11px 18px;border-radius:22px;z-index:20;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

/* 시작 */
.ob{padding-top:calc(26px + env(safe-area-inset-top));padding-bottom:24px}
.ob .say{font-size:36px;margin:72px 0 20px}
.ob .lead{color:var(--mu);font-size:15px;line-height:1.7;margin-bottom:28px}
.ob .btn{margin-top:36px}
.note a{color:inherit;text-decoration:underline}
.note{margin-top:22px;font-size:12px;color:var(--mu);line-height:1.65;text-align:center}

/* 분대 */
.mates{list-style:none;border-top:1px solid var(--ln);margin-top:28px}
.mate{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--ln)}
.mate .nm{display:block;font-weight:600;font-size:16px}
.mate.me .nm{font-weight:800}
.mate .dots{margin-left:auto;display:flex;gap:5px}
.mate .dots i{width:6px;height:6px;border-radius:50%;background:var(--ft)}
.mate .dots i.on{background:var(--tx)}
.mate .st{width:40px;text-align:right;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.mate .st.ok{color:var(--tx);font-weight:700}
.post{padding:18px 0;border-bottom:1px solid var(--ln)}
.post .ph{display:flex;align-items:baseline;justify-content:space-between}
.post .ph b{font-weight:700;font-size:14px}
.post p{margin-top:6px;font-size:16px;line-height:1.6;word-break:break-word}
.post img{display:block;width:100%;margin-top:12px;max-height:440px;object-fit:cover;filter:grayscale(1) contrast(1.06)}
.post .pa{margin-top:12px}
.cheer{height:34px;padding:0 14px;border-radius:17px;box-shadow:inset 0 0 0 1px var(--ln);font-size:12px;color:var(--mu);font-weight:500;transition:all .15s;font-variant-numeric:tabular-nums}
.cheer.on{box-shadow:inset 0 0 0 1px var(--tx);color:var(--tx);font-weight:700}
.pv{display:none;width:100%;margin-top:14px;max-height:220px;object-fit:cover;filter:grayscale(1) contrast(1.06)}
.pv.on{display:block}
.empty{padding:22px 0;color:var(--mu);font-size:14px;border-bottom:1px solid var(--ln)}

/* 기록 */
.huge{font-size:128px;font-weight:800;letter-spacing:-.065em;line-height:.88;font-variant-numeric:tabular-nums;margin:10px 0 0 -6px}
.hero{margin-top:60px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin-top:40px}
.st3 div{padding:16px 0}
.st3 div+div{border-left:1px solid var(--ln);padding-left:16px}
.st3 b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.miles{display:flex;justify-content:space-between;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ft);font-variant-numeric:tabular-nums;padding:4px 2px 18px}
.miles button{position:relative;padding:8px 2px;margin:-8px -2px}
.miles .hit,.miles .nx{color:var(--tx)}
.miles .hit{text-decoration:line-through;text-decoration-thickness:1px;color:var(--mu)}
.miles .nx::after{content:"";position:absolute;left:50%;bottom:-11px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.calh{display:flex;align-items:center;justify-content:space-between;margin:48px 0 10px}
.calh h2{margin:0}
.calh button{width:40px;height:40px;color:var(--mu);font-size:18px;border-radius:50%}
.calh button:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wd{font-size:10px;letter-spacing:.14em;color:var(--mu);padding:6px 0 10px}
.cal .d{width:34px;height:34px;margin:4px auto;display:grid;place-items:center;font-size:13px;border-radius:50%;color:var(--mu);font-variant-numeric:tabular-nums;position:relative}
.cal .d.off{color:var(--ft)}
.cal .d.part::after{content:"";position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--mu)}
.cal .d.rec{box-shadow:inset 0 0 0 1px var(--mu);color:var(--tx)}
.cal .d.full{background:var(--tx);color:var(--bg);font-weight:700}
.cal .d.now::before{content:"";position:absolute;top:-5px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
.lg{display:flex;gap:18px;justify-content:center;font-size:11px;color:var(--mu);margin-top:14px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.rf{padding:16px 0;border-bottom:1px solid var(--ln)}
.rf p{font-size:15px;line-height:1.65;margin-top:4px}
.rf p span{color:var(--mu);margin-right:10px;font-size:12px}
.set{list-style:none;border-top:1px solid var(--ln)}
.set button{display:flex;justify-content:space-between;align-items:center;width:100%;height:56px;border-bottom:1px solid var(--ln);font-size:16px;text-align:left}
.set button::after{content:"→";color:var(--ft);font-size:15px}
.set .dg{color:var(--dn)}
.chips.fx{display:flex;flex-wrap:wrap}
.chips.fx .chip{padding:0 15px}
.pils{list-style:none;border-top:1px solid var(--ln)}
.pil{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:17px 0;border-bottom:1px solid var(--ln);min-height:70px}
.pil .no{flex:none;width:34px;font-size:14px;font-weight:800}
.pil .bd{flex:1;min-width:0}
.pbar{display:block;height:2px;background:var(--ln)}
.pbar i{display:block;height:100%;background:var(--tx)}
.pm{display:block;font-size:12px;color:var(--mu);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pm b{color:var(--tx);font-weight:600}
.pil .arr{color:var(--ft);font-size:15px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px;font-variant-numeric:tabular-nums}
.memo{margin-top:30px;padding-left:14px;border-left:2px solid var(--tx)}
.memo .mt{font-size:17px;font-weight:600;line-height:1.5;margin-top:4px;word-break:keep-all}
.why{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.6}
.why b{color:var(--tx);font-weight:600}
.letter{font-size:17px;line-height:1.75;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.huge small{font-size:.28em;font-weight:600;letter-spacing:0;color:var(--mu);margin-left:.16em}
.miles .has::before{content:"";position:absolute;left:50%;top:-2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--mu)}
main{position:relative;z-index:1}
.hbg{position:absolute;left:-24px;right:-24px;top:0;height:460px;z-index:-1;background-size:cover;background-position:center 35%;filter:grayscale(1) contrast(1.05);opacity:.6;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent);mask-image:linear-gradient(to bottom,#000 30%,transparent);pointer-events:none}
.onimg .say{color:#BDBDBD;text-shadow:0 1px 18px rgba(0,0,0,.55)}
.onimg .say b{color:#fff}
.onimg .top .lbl,.onimg .vcap{color:#C4C4C4}
.onimg .top .lbl b,.onimg .vcap b{color:#fff}
.vcap{margin:-40px 0 44px}
.hbg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.52),rgba(0,0,0,.2) 70%)}
.ob4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 8px}
.ob4 img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.06)}
.ob4 span{display:block;font-size:11px;font-weight:600;color:var(--tx);margin-top:8px;white-space:nowrap}
.ob .vcap{display:none}
@media(prefers-color-scheme:light){.hbg{opacity:.2}.hbg::after{display:none}.onimg .say{color:var(--mu);text-shadow:none}.onimg .say b{color:var(--tx)}.onimg .top .lbl,.onimg .vcap{color:var(--mu)}.onimg .top .lbl b,.onimg .vcap b{color:var(--tx)}}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vt{position:relative;aspect-ratio:4/5;overflow:hidden;text-align:left;background:var(--sf2)}
.vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.14) brightness(1.05)}
.vt::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 52%,rgba(0,0,0,.82))}
.vl{position:absolute;left:12px;right:12px;bottom:12px;z-index:1}
.vl .lbl{display:block;color:#CFCFCF}
.vx{display:block;font-size:15px;font-weight:700;color:#fff;margin-top:3px;line-height:1.35;word-break:keep-all}
.vx.ph{color:#A0A0A0;font-weight:500}
.vth{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding:3px;scrollbar-width:none}
.vth button{flex:none;width:66px;aspect-ratio:4/5;opacity:.5;transition:opacity .15s}
.vth button.on{opacity:1;box-shadow:0 0 0 2px var(--tx)}
.vth img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.vpv{display:block;width:100%;aspect-ratio:4/5;max-height:52dvh;object-fit:cover;object-position:center 28%;margin-top:18px;filter:grayscale(1) contrast(1.14) brightness(1.05)}
.hero2{position:relative;margin:0 -24px;height:clamp(290px,39vh,360px);display:flex;flex-direction:column;justify-content:space-between;padding:0 24px;overflow:hidden;background:#000}
.himg{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center 28%;filter:grayscale(1) contrast(1.14) brightness(1.05)}
.hero2::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 54%,rgba(0,0,0,.86) 86%,#000 100%)}
.hero2 .top,.hero2 .hcap{position:relative;z-index:2;pointer-events:none}
.hero2 .top .lbl{color:#D2D2D2}.hero2 .top .lbl b{color:#fff}
.hero2 .say{margin:0 0 8px;font-size:27px;color:#D6D6D6;text-shadow:0 1px 14px rgba(0,0,0,.75)}.hero2 .say b{color:#fff}
.hero2 .vcap{margin:0 0 16px;color:#C8C8C8}.hero2 .vcap b{color:#fff}
.hero2 + .segs{margin-top:18px}
.hero2 ~ .rules{margin-top:20px}
.rule{min-height:68px!important;padding:14px 0!important}
#cv{display:block;width:min(100%,264px);margin:20px auto 0;box-shadow:0 0 0 1px var(--ln)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"></div>
<script>
// 기본 비전 사진: Unsplash License 사진을 흑백으로 변환·크롭해 img/ 폴더에 둠. 작가 이름은 VCRED.
window.VIMG = {"body":["img/body-01.jpg","img/champ-heath.jpg","img/champ-jackson1.jpg","img/champ-arnold.jpg","img/champ-greene.jpg","img/champ-jackson2.jpg","img/champ-coleman.jpg","img/body-02.jpg","img/body-03.jpg","img/body-04.jpg","img/body-05.jpg","img/body-06.jpg","img/body-07.jpg","img/body-08.jpg","img/body-09.jpg","img/body-10.jpg"],"mind":["img/mind-01.jpg","img/mind-02.jpg","img/mind-03.jpg"],"wealth":["img/wealth-01.jpg","img/wealth-02.jpg","img/wealth-03.jpg","img/wealth-04.jpg","img/wealth-05.jpg","img/wealth-06.jpg","img/wealth-07.jpg","img/wealth-08.jpg","img/wealth-09.jpg"],"family":["img/family-01.jpg","img/family-02.jpg","img/family-03.jpg"]};
window.VNOTE = {"img/champ-coleman.jpg":"로니 콜먼 · 미스터 올림피아 8회","img/champ-greene.jpg":"카이 그린 · 아놀드 클래식 3회 우승","img/champ-heath.jpg":"필 히스 · 미스터 올림피아 7회","img/champ-jackson1.jpg":"덱스터 잭슨 · 2008 미스터 올림피아","img/champ-jackson2.jpg":"덱스터 잭슨 · 2008 미스터 올림피아","img/champ-arnold.jpg":"아놀드 슈워제네거 · 미스터 올림피아 7회"};
window.VCRED = "Charles Gaudreault, Daniel Stiel, Travis Macfarlane, Anway Pawar, Aravind Mylakkara, Michiel Annaert, Joshua Freake, Muhammed Nishal, kofa boyah, Grgur Vučkov, Mukesh Sharma, Tony Chen, Thilina Alagiyawanna, Ville Kaisla, Bailey Alexander, Jeremy Beadle, Alen Kajtezovic, Danilo Capece, Norbert Buduczki, Brian Lee, Riccardo Pitzalis, Colynary Media, Elodie Debard, Ali Muhammad, Mika Ruusunen";
</script>
<script>
(() => {
const KEY = 'jeongjin.v1', DAY_SHIFT = 3; // 하루의 경계는 새벽 3시
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0'), p3 = n => String(n).padStart(3, '0');
const dkey = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const lnow = () => new Date(Date.now() - DAY_SHIFT * 3600e3);
const today = () => dkey(lnow());
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dkey(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const hash = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const lhour = () => { const d = new Date(); let h = d.getHours() + d.getMinutes() / 60; if (h < DAY_SHIFT) h += 24; return h; };
const fmtDate = d => d.getFullYear() + '.' + p2(d.getMonth() + 1) + '.' + p2(d.getDate()) + ' ' + ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];

  { id: 'family', ko: '가족', opts: ['폰 없이 30분', '감사 한마디', '함께 식사'], sub: '온전히 함께', m: { label: '주간 함께한 시간', unit: '시간', step: '0.5' } }
];

];

function load() { try { return migrate(JSON.parse(localStorage.getItem(KEY)) || null); } catch (e) { return null; } }
function migrate(s) { if (!s) return s; s.metrics = s.metrics || {}; s.letters = s.letters || {}; s.seen = s.seen || {}; s.vision = s.vision || {};
  if (!s.rules || !s.rules.some(r => r.id === 'wake')) return s; // 이전 버전(기상·운동·독서·절제·회고) 기록을 네 기둥으로 옮김
  const old = s.rules.map(r => r.id), tt = id => (s.rules.find(r => r.id === id) || {}).title;
  s.rules = [{ id: 'body', p: '몸', title: tt('train') || '운동 30분', sub: '땀이 날 만큼' }, { id: 'mind', p: '정신', title: tt('read') || '독서 10쪽', sub: '머리를 맑게' },
    { id: 'wealth', p: '돈', title: '돈 되는 일 1시간', sub: '가장 중요한 일 먼저' }, { id: 'family', p: '가족', title: '폰 없이 30분', sub: '온전히 함께' },
    { id: 'reflect', p: '회고', title: '저녁 회고 3줄', sub: '잘한 것, 부족한 것, 내일 할 것' }];
  Object.values(s.days || {}).forEach(d => { const o = d.done || {};
    d.done = old.every(id => o[id]) ? { body: 1, mind: 1, wealth: 1, family: 1, reflect: 1 } : Object.assign({}, o.train && { body: o.train }, o.read && { mind: o.read }, o.reflect && { reflect: o.reflect }); });
  return s; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('저장 공간이 부족합니다. 오래된 인증 사진을 지워 주세요.'); } }

/* ---------- 계산 ---------- */
const getDay = k => S.days[k] || { done: {} };
const day = k => S.days[k] || (S.days[k] = { done: {} });
const count = k => { const d = getDay(k); return S.rules.filter(r => d.done[r.id]).length; };
const complete = k => count(k) === S.rules.length;
const kept = k => complete(k) || !!getDay(k).recovered;
const total = () => Object.keys(S.days).filter(k => complete(k)).length;
const dayNo = () => diffDays(S.profile.start, today()) + 1;
function streak() { let k = today(), n = 0; if (!kept(k)) k = addDays(k, -1); while (k >= S.profile.start && kept(k)) { n++; k = addDays(k, -1); } return n; }
function best() { let k = S.profile.start, e = today(), run = 0, mx = 0; while (k <= e) { if (kept(k)) { run++; mx = Math.max(mx, run); } else if (k !== e) run = 0; k = addDays(k, 1); } return mx; }
function rate() { const el = dayNo() - (complete(today()) ? 0 : 1); return el > 0 ? Math.round(total() / el * 100) : 0; }
function phase() { const n = dayNo();
  if (n <= 14) return { name: '입문 2주', n, len: 14 };
  if (n <= 44) return { name: '30일 과정', n: n - 14, len: 30 };
  if (n <= 144) return { name: '100일 과정', n: n - 44, len: 100 };
  return { name: '자유 수련', n, len: 0 }; }
const say = () => SAYS[Math.floor(parse(today()).getTime() / 864e5) % SAYS.length];
const sayHtml = s => esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>');
const needRecover = () => { const y = addDays(today(), -1); return y >= S.profile.start && !kept(y); };
const postedToday = () => S.posts.some(p => p.date === today());
function fmtTs(ts) { const d = new Date(ts), n = new Date(), hm = p2(d.getHours()) + ':' + p2(d.getMinutes()), dd = diffDays(dkey(d), dkey(n));
  return dd === 0 ? hm : dd === 1 ? '어제 ' + hm : p2(d.getMonth() + 1) + '.' + p2(d.getDate()); }
function feed() { return S.posts.slice().sort((a, b) => b.ts - a.ts); }

function pillarRate(id) { const k = today(); let d = addDays(k, -27); if (d < S.profile.start) d = S.profile.start; let n = 0, ok = 0;
  while (d <= k) { const done = !!getDay(d).done[id]; if (d < k || done) { n++; if (done) ok++; } d = addDays(d, 1); } return n ? Math.round(ok / n * 100) : null; }
function vPillars() { const rows = PILLARS.map(p => { const r = pillarRate(p.id), h = S.metrics[p.id] || [], last = h[h.length - 1], first = h[0];

function vMemo(done) { if (done) return ''; const y = getDay(addDays(today(), -1)).reflect;
  return y && y.c ? `<section class="memo"><p class="lbl">어제의 내가 남긴 말</p><p class="mt">${esc(y.c)}</p></section>` : ''; }
function vWhy() { return S.profile.why ? `<p class="why">시작한 이유 · <b>${esc(S.profile.why)}</b></p>` : ''; }
function vEvening(left) { const w = S.profile.why;
  return `<section class="blk"><p class="lbl">오늘 · 남은 ${left}가지</p><p class="ct">${w ? esc(w) : '아직 오늘이 남았습니다'}</p><p class="hint">${w ? '시작한 이유입니다. ' : ''}가장 쉬운 것 하나부터 합니다.</p></section>`; }
function weekCmp() { const k = today(), dow = (parse(k).getDay() + 6) % 7, mon = addDays(k, -dow); let a = 0, b = 0;
  for (let i = 0; i <= dow; i++) { a += count(addDays(mon, i)); b += count(addDays(mon, i - 7)); }
  return { a, b, has: addDays(mon, -7) >= S.profile.start }; }
function vWeek() { const w = weekCmp(), d = w.a - w.b;
  return `<p class="hint" style="margin-top:14px">이번 주 체크 <b>${w.a}개</b>${w.has ? ` · 지난주 같은 요일까지 ${w.b}개 <b>(${d > 0 ? '+' : d < 0 ? '−' : '±'}${Math.abs(d)})</b>` : ''}</p>`; }

function render() {

  app.innerHTML = `<main class="${ui.tab === 'today' ? 'onimg' : ''}">${ui.tab === 'today' ? vToday() : ui.tab === 'squad' ? vSquad() : vMe()}</main>${vTabs()}${vSheet()}`;

  if (ui.sheet === 'card') drawCard();
  if (ui.sheet) requestAnimationFrame(() => { const el = app.querySelector('.sheet [autofocus]'); if (el) el.focus(); });

/* ---------- 오늘의 카드 (1080x1350) ---------- */
async function drawCard() { const cv = document.getElementById('cv'); if (!cv) return;
  const x = cv.getContext('2d'), W = 1080, H = 1350, P = 84, k = today(), c = count(k), n = S.rules.length, s = say(), plain = s.replace(/\*/g, '');
  const F = '"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  try { await Promise.all([800, 600, 500].map(w => document.fonts.load(w + ' 60px "Pretendard Variable"', 'JEONGJINDAY0123456789./ 완료연속일몸정신돈가족회고' + plain + fmtDate(lnow())))); } catch (e) {}
  if (!document.getElementById('cv')) return;
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  if (ui.cardImg) { const im = ui.cardImg, sc = Math.max(W / im.width, H / im.height), w = im.width * sc, h = im.height * sc; x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
    const d = x.getImageData(0, 0, W, H), a = d.data; for (let i = 0; i < a.length; i += 4) { const g = a[i] * .299 + a[i + 1] * .587 + a[i + 2] * .114; a[i] = a[i + 1] = a[i + 2] = g; } x.putImageData(d, 0, 0);
    x.fillStyle = 'rgba(0,0,0,.4)'; x.fillRect(0, 0, W, H);
    const gr = x.createLinearGradient(0, H * .3, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.94)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); }
  const tr = (t, px, py, size, wt, sp, col, right) => { x.font = `${wt} ${size}px ${F}`; x.fillStyle = col; x.textBaseline = 'alphabetic'; const ch = [...t]; let w = -sp; ch.forEach(q => w += x.measureText(q).width + sp);
    let cx = right ? px - w : px; ch.forEach(q => { x.fillText(q, cx, py); cx += x.measureText(q).width + sp; }); };
  x.fillStyle = '#E5392B'; x.beginPath(); x.arc(P + 7, 113, 7, 0, 7); x.fill();
  tr('JEONGJIN', P + 30, 122, 26, 600, 9, '#FFFFFF');
  tr(fmtDate(lnow()), W - P, 122, 26, 500, 5, '#9A9A9A', true);
  tr('DAY', P + 4, 762, 30, 600, 14, '#9A9A9A');
  tr(p3(dayNo()), P - 10, 1012, 300, 800, -12, '#FFFFFF');
  const parts = s.split('*'); let fs = 46; const meas = () => { let w = 0; parts.forEach((p, i) => { x.font = `${i % 2 ? 800 : 500} ${fs}px ${F}`; w += x.measureText(p).width; }); return w; };
  while (meas() > W - 2 * P && fs > 28) fs -= 2;
  let cx = P; parts.forEach((p, i) => { x.font = `${i % 2 ? 800 : 500} ${fs}px ${F}`; x.fillStyle = i % 2 ? '#FFFFFF' : '#9A9A9A'; x.fillText(p, cx, 1100); cx += x.measureText(p).width; });
  const d0 = getDay(k), gw = (W - 2 * P - (n - 1) * 12) / n;
  S.rules.forEach((r, i) => { const on = !!d0.done[r.id], gx = P + i * (gw + 12); x.fillStyle = on ? '#FFFFFF' : '#333333'; x.fillRect(gx, 1160, gw, 5);
    tr(r.p || p2(i + 1), gx, 1204, 24, on ? 700 : 500, 2, on ? '#FFFFFF' : '#6A6A6A'); });
  tr(`${c} / ${n}  완료`, P, 1266, 26, 600, 5, '#FFFFFF');
  tr(`연속 ${streak()}일`, W - P, 1266, 26, 500, 5, '#9A9A9A', true);
}

let toastT;
function toast(msg) { document.querySelectorAll('.toast').forEach(e => e.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); }
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const val = id => (document.getElementById(id)?.value || '').trim();
function shrink(file) { return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const sc = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .72)); };
  img.onerror = rej; img.src = URL.createObjectURL(file); }); }
const cardBlob = () => new Promise(r => document.getElementById('cv').toBlob(r, 'image/png'));
const finish = (was, k, other) => { if (!was && complete(k)) { vib([10, 60, 20]); toast('오늘 수련 완료'); } else if (other) toast(other); };

    const h = S.metrics[ui.mid] || (S.metrics[ui.mid] = []), k = today(), i = h.findIndex(e => e.d === k); if (i >= 0) h[i].v = v; else h.push({ d: k, v });
    ui.sheet = null; save(); render(); toast('기록했습니다'); },
  openMile(t) { ui.mile = Number(t.dataset.v); ui.sheet = 'mile'; render(); },
  saveLetter() { const v = val('lt-v'); if (v) S.letters[ui.mile] = v; else delete S.letters[ui.mile]; ui.sheet = null; save(); render(); toast(v ? '편지를 봉인했습니다' : '편지를 비웠습니다'); },
  openWhy() { ui.sheet = 'why'; render(); },
  saveWhy() { S.profile.why = val('wy-v'); ui.sheet = null; save(); render(); toast('저장했습니다'); },
  openVision(t) { ui.mid = t.dataset.id; ui.visImg = null; ui.visUseDef = false; ui.visPin = vis(ui.mid).img ? null : (vis(ui.mid).pin ?? null); ui.sheet = 'vision'; render(); },
  pinVision(t) { const i = Number(t.dataset.v), a = VIMG[ui.mid]; ui.visPin = ui.visPin === i ? null : i; ui.visImg = null; ui.visUseDef = true; document.getElementById('vs-pv').src = ui.visPin != null ? a[ui.visPin] : a[dayIdx() % a.length]; document.querySelectorAll('.vth button').forEach((b, j) => b.classList.toggle('on', j === ui.visPin)); },
  pickVision() { document.getElementById('vs-f').click(); },
  saveVision() { const v = S.vision[ui.mid] || (S.vision[ui.mid] = {}); v.text = val('vs-t'); if (ui.visImg) { v.img = ui.visImg; delete v.pin; } else if (ui.visUseDef) { delete v.img; if (ui.visPin != null) v.pin = ui.visPin; else delete v.pin; } ui.visImg = null; ui.sheet = null; save(); render(); toast('저장했습니다'); },
  resetVision() { const v = S.vision[ui.mid] || (S.vision[ui.mid] = {}); v.text = val('vs-t'); delete v.img; ui.visImg = null; save(); render(); },
  heroNext() { ui.heroOff = (ui.heroOff || 0) + 1; render(); },
  openRules() { ui.sheet = 'rules'; render(); },
  saveRules() { for (const r of S.rules) { if (r.id === 'reflect') continue; if (!val('ru-' + r.id)) return toast('빈 계율이 있습니다'); }
    S.rules.forEach(r => { if (r.id !== 'reflect') r.title = val('ru-' + r.id); }); ui.sheet = null; save(); render(); toast('계율을 고쳤습니다'); },
  export() { S.lastExport = today(); save(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = 'jeongjin-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); render(); toast('기록 파일을 저장했습니다'); },
  pickImport() { document.getElementById('im-f').click(); },
  doImport() { S = ui.imp; ui.imp = null; ui.sheet = null; const t = total(); MILES.forEach(m => { if (t >= m) S.seen[m] = 1; }); save(); ui.tab = 'today'; render(); window.scrollTo(0, 0); toast('기록을 가져왔습니다'); },
  openReset() { ui.sheet = 'reset'; render(); },
  reset() { try { localStorage.removeItem(KEY); } catch (e) {} S = null; ui.sheet = null; ui.tab = 'today'; ui.ob = { name: '', why: '', pick: { body: 0, mind: 0, wealth: 0, family: 0 } }; render(); window.scrollTo(0, 0); },
  close() { ui.sheet = null; render(); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) f(t, e); });
document.addEventListener('input', e => { if (e.target.id === 'ob-name') ui.ob.name = e.target.value; if (e.target.id === 'ob-why') ui.ob.why = e.target.value; });
document.addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; if (!f) return;
  if (e.target.id === 'po-f') { try { ui.postImg = await shrink(f); const pv = document.getElementById('po-pv'); pv.src = ui.postImg; pv.classList.add('on'); const b = document.querySelector('[data-act=pickImg]'); if (b) b.textContent = '사진 바꾸기'; } catch (err) { toast('사진을 불러오지 못했습니다'); } }
  if (e.target.id === 'vs-f') { try { ui.visImg = await shrink(f); document.getElementById('vs-pv').src = ui.visImg; } catch (err) { toast('사진을 불러오지 못했습니다'); } }
  if (e.target.id === 'im-f') { try { const d = migrate(JSON.parse(await f.text())); if (!d || !d.profile || !d.profile.start || !Array.isArray(d.rules) || !d.days) throw 0; d.posts = d.posts || []; d.cheered = d.cheered || {}; ui.imp = d; ui.sheet = 'import'; render(); } catch (err) { toast('정진 기록 파일이 아닙니다'); } }
  if (e.target.id === 'cd-f') { const im = new Image(); im.onload = () => { ui.cardImg = im; const b = document.querySelector('[data-act=pickCard]'); if (b) b.textContent = '사진 바꾸기'; drawCard(); }; im.onerror = () => toast('사진을 불러오지 못했습니다'); im.src = URL.createObjectURL(f); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) ACT.close();
  if (e.key === 'Enter' && e.target.id === 'ob-name') ACT.start();
  if (e.key === 'Enter' && /^rf-/.test(e.target.id)) { const nx = { 'rf-a': 'rf-b', 'rf-b': 'rf-c' }[e.target.id]; nx ? document.getElementById(nx).focus() : ACT.saveReflect(); } });
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay && !ui.sheet) { lastDay = today(); render(); } });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(() => { try { Object.values(VIMG).flat().forEach(u => { const i = new Image(); i.src = u; }); } catch (e) {} }, 4000);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
render();
})();
